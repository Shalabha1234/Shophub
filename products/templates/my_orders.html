<!DOCTYPE html>
<html>
<head>
    <title>My Orders</title>
</head>
<body>

    <h1>My Orders</h1>

    {% if orders %}

        {% for order in orders %}

            <div>
                <h2>Order #{{ order.id }}</h2>

                <p>Total Amount: ₹{{ order.total_amount }}</p>

                <p>Status: {{ order.status }}</p>

                <p>Placed on: {{ order.created_at }}</p>
            </div>

            <hr>

        {% endfor %}

    {% else %}

        <p>You have no orders yet.</p>

    {% endif %}

</body>
</html>
