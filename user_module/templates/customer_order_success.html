<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful - ShopHub</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-2xl mx-auto px-6 py-16">

        <div class="bg-white rounded-2xl shadow-sm p-10 text-center">

            <!-- SUCCESS ICON -->

            <div class="w-20 h-20 mx-auto mb-6 bg-green-100 rounded-full flex items-center justify-center">

                <span class="text-4xl text-green-600">
                    ✓
                </span>

            </div>


            <!-- TITLE -->

            <h1 class="text-3xl font-bold text-gray-800 mb-3">
                Order Placed Successfully!
            </h1>

            <p class="text-gray-500 mb-8">
                Thank you for your purchase.
            </p>


            <!-- ORDER DETAILS -->

            <div class="bg-gray-50 rounded-xl p-6 mb-8">

                <p class="text-sm text-gray-500 mb-2">
                    Order Number
                </p>

                <p class="text-xl font-bold text-teal-800">
                    #{{ order.id }}
                </p>


                <div class="border-t border-gray-200 my-5"></div>


                <p class="text-sm text-gray-500 mb-2">
                    Order Total
                </p>

                <p class="text-2xl font-bold text-gray-800">
                    ₹{{ order.total_amount }}
                </p>

            </div>


            <!-- BUTTONS -->

            <div class="flex flex-col sm:flex-row gap-4 justify-center">

                <a
                    href="{% url 'customer_home' %}"
                    class="bg-teal-700 text-white px-6 py-3 rounded-xl hover:bg-teal-800 font-medium">

                    Continue Shopping

                </a>

                <a
                    href="{% url 'customer_dashboard' %}"
                    class="border border-teal-700 text-teal-700 px-6 py-3 rounded-xl hover:bg-teal-50 font-medium">

                    My Account

                </a>

            </div>

        </div>

    </div>

</body>

</html>
